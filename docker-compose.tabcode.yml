# 独立实例：对外只开放 8280（nginx 同时反代 Next 前台和 PHP 后台）
# 不占用已有 8180/8181 那套 acg-faka。
name: tabcode-shop

services:
  nginx:
    image: nginx:1.27-alpine
    container_name: tabcode-nginx
    ports:
      - "8280:80"
    volumes:
      - ./deploy/nginx-tabcode.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - web
      - frontend
    restart: unless-stopped
    networks:
      - tabcode-net

  frontend:
    build:
      context: ./frontend
      args:
        API_BASE: http://web:80
    container_name: tabcode-frontend
    environment:
      API_BASE: http://web:80
      HOSTNAME: "0.0.0.0"
      PORT: "3000"
      RECHARGE_INTERNAL_KEY: ${RECHARGE_INTERNAL_KEY:-}
    restart: unless-stopped
    networks:
      - tabcode-net

  web:
    build: .
    container_name: tabcode-web
    environment:
      - STOREFRONT_URL=${STOREFRONT_URL:-http://38.34.191.113:8280}
      - RECHARGE_INTERNAL_KEY=${RECHARGE_INTERNAL_KEY:-}
    volumes:
      - .:/var/www/html
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
    restart: unless-stopped
    networks:
      - tabcode-net

  redis:
    image: redis:7-alpine
    container_name: tabcode-redis
    volumes:
      - tabcode_redis_data:/data
    command: redis-server --appendonly yes
    restart: unless-stopped
    networks:
      - tabcode-net

  mysql:
    image: mysql:8.0
    container_name: tabcode-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    volumes:
      - tabcode_mysql_data:/var/lib/mysql
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-authentication-plugin=mysql_native_password
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped
    networks:
      - tabcode-net

volumes:
  tabcode_mysql_data:
  tabcode_redis_data:

networks:
  tabcode-net:
    driver: bridge
