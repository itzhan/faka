#{include file="./Header.html"}
<main class="nagoya-main">
    <section class="nagoya-shell nagoya-shell-narrow">
        <section class="nagoya-page-hero nagoya-page-hero-light">
            <span class="nagoya-eyebrow">Order Lookup</span>
            <h1 class="nagoya-page-title">订单查询</h1>
            <p class="nagoya-page-summary">输入订单号或联系方式，查看你的购买记录。</p>
        </section>

        <div class="nagoya-query-panel">
            <div class="nagoya-query-form-shell">
                <form class="order-query-form">
                    <div class="nagoya-query-form">
                        <input type="text" class="form-control" name="keywords" value="#{$tradeNo}" placeholder="请输入订单号或联系方式">
                        <button type="submit" class="nagoya-button nagoya-button-blue btn-search-query">
                            <i class="fa-duotone fa-regular fa-magnifying-glass"></i>
                            <span>查询订单</span>
                        </button>
                    </div>
                </form>
            </div>
        </div>

        <div class="order-results" style="display: none;">
            <div class="nagoya-results-panel">
                <div class="order-list"></div>
            </div>
        </div>

        <div class="no-results" style="display: none;">
            <div class="nagoya-empty-card">
                <i class="fa-duotone fa-regular fa-search"></i>
                <h3>未找到相关订单</h3>
                <p>请确认订单号或联系方式是否正确，必要时可联系客服协助处理。</p>
            </div>
        </div>

        <div class="loading-state" style="display: none;">
            <div class="nagoya-empty-card">
                <i class="fa-duotone fa-regular fa-spinner-third icon-spin"></i>
                <h3>正在查询订单信息</h3>
                <p>请稍候，系统正在拉取订单记录。</p>
            </div>
        </div>
    </section>
</main>
#{ready("/assets/user/controller/index/query.js")}
#{include file="./Footer.html"}
